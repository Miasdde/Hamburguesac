<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Food Orderr</title>

    
 <link href="framework7.bundle.min.css" rel="stylesheet">

    
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <link href="style.css" rel="stylesheet">
</head>


<body>

    <div id="app">

        <div class="view view-main view-init">

            <section data-name="home" class="page">


                
                <nav class="navbar">

                    <div class="navbar-bg"></div>

                    <div class="navbar-inner">

                        
                        <div class="left">
                            <a href="#" class="link">
                                <i class="material-icons">menu</i>
                            </a>
                        </div>

                        
                        <div class="title">
                            Food Orderr
                        </div>

                        
                        <div class="right">
                            <a href="#" class="link">
                                <i class="material-icons">account_circle</i>
                            </a>
                        </div>

                    </div>

                </nav>


                
                <section class="page-content">


                    
                    <div class="block-title">
                        Popular Item
                    </div>


                    <div class="block">

                        <div class="row">


                    
                            <div class="col-50">

                                <div class="card">

                                    <div class="card-content card-content-padding">

                                        <img src="pexels-labskiii-10065180.jpg"
                                             class="burger-img">

                                        <h4 class="product-name">
                                            Beef Burger
                                        </h4>

                                        <p class="product-description">
                                            Cheesy Mozzarella
                                        </p>


                                        <div class="price-row">

                                            <span class="price">
                                                $7.90
                                            </span>

                                            <i class="material-icons add-icon">
                                                add_box
                                            </i>

                                        </div>

                                    </div>

                                </div>

                            </div>


                            
                            <div class="col-50">

                                <div class="card">

                                    <div class="card-content card-content-padding">

                                        <img src="pexels-labskiii-10065179.jpg"
                                             class="burger-img">

                                        <h4 class="product-name">
                                            Big Mac
                                        </h4>

                                        <p class="product-description">
                                            Cheesy Mozzarella
                                        </p>


                                        <div class="price-row">

                                            <span class="price">
                                                $7.90
                                            </span>

                                            <i class="material-icons add-icon">
                                                add_box
                                            </i>

                                        </div>

                                    </div>

                                </div>

                            </div>


                        </div>

                    </div>


                    <div class="block pizza-block">

                       <img src="descuento-h,.jpg"
                             class="pizza-banner">

                    </div>


                </section>
                


                
                <div class="toolbar toolbar-bottom">

                    <div class="toolbar-inner">

                        <a href="#" class="link">
                            <i class="material-icons">home</i>
                        </a>

                        <a href="#" class="link">
                            <i class="material-icons">shopping_basket</i>
                        </a>

                        <a href="#" class="link">
                            <i class="material-icons">account_circle</i>
                        </a>

                    </div>

                </div>


            </section>

        </div>

    </div>


    <script src="framework7.bundle.min.js"></script>
<script src="app.js"></script>

</body>

</html>
